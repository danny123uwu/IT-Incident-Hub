name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (lint + pruebas + PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Base efímera solo para el job: no hay credenciales reales.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Pruebas (unitarias, API e integración con PostgreSQL)
        run: npm run test:ci
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + pruebas + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Pruebas con cobertura
        run: npm run test:ci
      - name: Build de producción
        run: npm run build
      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  dependencies:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (solo dependencias de producción, severidad alta o crítica)
        working-directory: ${{ matrix.project }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Reporte completo de auditoría (informativo)
        if: always()
        working-directory: ${{ matrix.project }}
        run: npm audit --json > ../audit-${{ matrix.project }}.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.project }}
          path: audit-${{ matrix.project }}.json

  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  docker-smoke:
    name: Contenedores + prueba de humo
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Crear .env con contraseña aleatoria
        run: sed "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env.example > .env
      - name: Levantar el sistema completo
        run: docker compose up -d --build --wait
      - name: Prueba de humo extremo a extremo
        run: node tests/smoke.mjs
        env:
          BASE_URL: http://localhost:8080
      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color
      - name: Limpiar
        if: always()
        run: docker compose down --volumes --remove-orphans
