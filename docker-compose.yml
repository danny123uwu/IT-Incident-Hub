name: incident-hub

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidenthub}
      POSTGRES_USER: ${POSTGRES_USER:-incidenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (el lanzador crea .env automáticamente)}
    volumes:
      # PostgreSQL 18+ guarda los datos en /var/lib/postgresql/<versión>/docker,
      # por eso el volumen se monta en /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: incident-hub-backend:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-incidenthub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-incidenthub}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: incident-hub-frontend:${APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ---- Pruebas dentro de contenedores (no se levantan con "up") ----
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-incidenthub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-incidenthub}
      SCHEMA_FILE: /database/init.sql
    volumes:
      - ./database:/database:ro
    depends_on:
      db:
        condition: service_healthy

  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      target: test

volumes:
  db-data:
